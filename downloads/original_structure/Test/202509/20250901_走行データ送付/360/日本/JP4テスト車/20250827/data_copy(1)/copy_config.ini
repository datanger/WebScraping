[PERFORMANCE]
# Copy performance mode: fast, balanced, safe
# fast: High concurrency, minimal verification, optimized for speed
# balanced: Moderate concurrency, standard verification, good balance
# safe: Low concurrency, extensive verification, maximum reliability
performance_mode = fast

# Maximum number of concurrent copy threads
max_concurrent_threads = 8

# Buffer size for file operations (bytes)
file_buffer_size = 16777216

# Progress update interval (seconds)
progress_update_interval = 10

# Verification tolerance for file size comparison (bytes)
verification_tolerance = 2048

[VEHICLE]
# Expected vehicle model (e.g., RV1, RV2, RV3, etc.)
# This will be validated against detected vehicle model from Vector drive
expected_vehicle_model = RV1

# Enable strict vehicle model validation
# If true, copy will be aborted if detected model doesn't match expected
strict_vehicle_validation = true

[LOGGING]
# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO

# Enable detailed progress logging
detailed_progress_logging = true

# Enable file-by-file copy logging
file_copy_logging = false

[COPY_OPTIONS]
# Skip files that already exist in destination
skip_existing_files = false

# Verify file integrity after copy (checksum comparison)
verify_file_integrity = false

# Maximum retry attempts for failed file copies
max_retry_attempts = 2

# Retry delay between attempts (seconds)
retry_delay = 3

[ADVANCED]
# Enable experimental features
enable_experimental_features = false

# Custom copy buffer size for large files (bytes)
large_file_buffer_size = 33554432

# Timeout for individual file operations (seconds)
file_operation_timeout = 600
